name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "runners OK"
  build:
    # جهازان معاً: إن تأخر Mac الحديث يُبنى على Mac إنتل
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Shaghil.xcodeproj -target Shaghil -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -B2 -A8 "error:" build.log | head -200; exit 1; }

      - name: Ad-hoc sign with entitlements and package IPA
        run: |
          APP=build/Release-iphoneos/Shaghil.app
          APPEX="$APP/PlugIns/ShaghilWidget.appex"
          codesign -f -s - --entitlements Signing/widget.entitlements "$APPEX"
          codesign -f -s - --entitlements Signing/app.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          plutil -p "$APP/Info.plist" | head -40
          ls "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Shaghil-1.0.ipa Payload && ls -la

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Shaghil.xcodeproj -target Shaghil -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          APP=simbuild/Debug-iphonesimulator/Shaghil.app
          xcrun simctl install "$UDID" "$APP"
          BID=om.khanbashi.shaghil
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          run() { name=$1; wait=$2; shift 2; xcrun simctl terminate "$UDID" $BID 2>/dev/null || true; \
            (xcrun simctl launch --console-pty "$UDID" $BID "$@" > "logs/$name.txt" 2>&1 &); shot "$name" "$wait"; }
          mkdir -p logs
          run 1-empty 6
          run 2-home 7 -seedDemo
          run 3-code 7 -seedDemo -open code
          run 4-run 9 -seedDemo -open run
          run 5-fullscreen 9 -seedDemo -open full
          xcrun simctl ui "$UDID" appearance dark
          run 6-home-dark 6 -seedDemo
          xcrun simctl terminate "$UDID" $BID || true
          for f in logs/*.txt; do echo "=== $f"; tail -40 "$f"; done
          echo "=== crash reports"
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i shaghil || echo none
          for f in ~/Library/Logs/DiagnosticReports/Shaghil*; do [ -f "$f" ] || continue; echo "=== $f"; python3 - "$f" <<'PY'
          import json,sys
          t=open(sys.argv[1]).read(); parts=t.split('\n',1)
          try:
              d=json.loads(parts[1])
              print(d.get('exception'), d.get('termination',{}).get('indicator'))
              ft=d.get('faultingThread',0); th=d['threads'][ft]
              imgs=d.get('usedImages',[])
              for fr in th['frames'][:25]:
                  im=imgs[fr['imageIndex']].get('name','?') if fr.get('imageIndex') is not None and fr['imageIndex']<len(imgs) else '?'
                  print(im, fr.get('symbol','?'), fr.get('sourceFile',''), fr.get('sourceLine',''))
              for k in ('asi','lastExceptionBacktrace'):
                  if k in d: print(k, str(d[k])[:1500])
          except Exception as e:
              print('parse fail', e); print(t[:3000])
          PY
          cp "$f" logs/ ; done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: Shaghil-ipa-${{ matrix.os }}
          path: |
            out/Shaghil-1.0.ipa
            shots/*.png
            logs/*

      - name: Publish release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0 >/dev/null 2>&1 || gh release create v1.0 --title "شغّل 1.0" --notes "IPA غير موقّع (موقّع ad-hoc مع App Groups) — وقّعه بأداة التوقيع ثم ثبّته." || true
          gh release upload v1.0 out/Shaghil-1.0.ipa --clobber
          ls shots/*.png >/dev/null 2>&1 && gh release upload v1.0 shots/*.png --clobber || true
