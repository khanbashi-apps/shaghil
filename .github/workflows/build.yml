name: build-ipa
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Shaghil.xcodeproj -target Shaghil -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/Shaghil.app || { grep -B2 -A8 "error:" build.log | head -200; exit 1; }

      - name: Ad-hoc sign with entitlements and package IPA
        run: |
          APP=build/Release-iphoneos/Shaghil.app
          APPEX="$APP/PlugIns/ShaghilWidget.appex"
          codesign -f -s - --entitlements Signing/widget.entitlements "$APPEX"
          codesign -f -s - --entitlements Signing/app.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          plutil -p "$APP/Info.plist" | head -40
          ls "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Shaghil-1.0.ipa Payload && ls -la

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Shaghil.xcodeproj -target Shaghil -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/simbuild" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c=c or [x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          APP=simbuild/Debug-iphonesimulator/Shaghil.app
          xcrun simctl install "$UDID" "$APP"
          BID=om.khanbashi.shaghil
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          xcrun simctl launch "$UDID" $BID; shot 1-empty 6
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -seedDemo; shot 2-home 6
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -seedDemo -open code; shot 3-code 6
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -seedDemo -open run; shot 4-run 8
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -seedDemo -open full; shot 5-fullscreen 8
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl terminate "$UDID" $BID
          xcrun simctl launch "$UDID" $BID -seedDemo; shot 6-home-dark 6
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: Shaghil-ipa
          path: |
            out/Shaghil-1.0.ipa
            shots/*.png

      - name: Publish release (direct download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0 --yes --cleanup-tag || true
          gh release create v1.0 out/Shaghil-1.0.ipa shots/*.png --title "شغّل 1.0" --notes "IPA غير موقّع (موقّع ad-hoc مع App Groups) — وقّعه بأداة التوقيع ثم ثبّته."
