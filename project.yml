name: Shaghil
options:
  bundleIdPrefix: om.khanbashi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: ar
targets:
  Shaghil:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: om.khanbashi.shaghil
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "شغّل"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "لاختيار صورة أيقونة للمشروع"
    dependencies:
      - target: ShaghilWidget
  ShaghilWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: [Info.plist]
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "شغّل"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: om.khanbashi.shaghil.widget
